<article class="card" data-title="{{ book.title|lower }} {{ book.author.name|lower }}">
  <a class="cover" style="--h:{{ book.id }}" href="{{ book.get_absolute_url }}">
    {% if book.cover %}<img src="{{ book.cover.url }}" alt="Обложка: {{ book.title }}">{% else %}<span class="t">{{ book.title }}</span><span class="a">{{ book.author }}</span>{% endif %}
  </a>
  <div class="info">
    <h3><a href="{{ book.get_absolute_url }}">{{ book.title }}</a></h3>
    <p class="muted">{{ book.author }}, {{ book.year }}</p>
    {% if book.category %}<span class="tag">{{ book.category }}</span>{% endif %}
  </div>
</article>
